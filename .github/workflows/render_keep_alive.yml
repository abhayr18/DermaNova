name: Render 24/7 Keep-Alive Heartbeat

on:
  schedule:
    # Runs every 12 minutes (Render free tier sleeps after 15 minutes of inactivity)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat to Render Backend
        run: |
          TARGET_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://dermanova-api.onrender.com"
          fi
          echo "Sending keep-alive ping to: $TARGET_URL/health"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL/health" || echo "failed")
          echo "Health check HTTP response code: $RESPONSE"
